name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorNexus-Web
          path: apps/studio/dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorNexus-Windows
          path: apps/studio/src-tauri/target/release/bundle/nsis/*.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run tauri -- build --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorNexus-Linux
          path: apps/studio/src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run tauri -- build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorNexus-macOS
          path: apps/studio/src-tauri/target/release/bundle/dmg/*.dmg

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android NDK LTS
        run: |
          sdkmanager "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Initialize Android project
        run: npm run tauri -- android init --ci
      - name: Build installable debug APK
        run: npm run tauri -- android build --debug --apk --ci
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorNexus-Android
          path: apps/studio/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
